<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Action Ventures · Intelligence Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;0,9..40,900;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070b;--surface:rgba(255,255,255,.04);--surface2:rgba(255,255,255,.065);--border:rgba(255,255,255,.09);--border2:rgba(255,255,255,.16);--text:#f0efe8;--soft:#c9c8c0;--muted:#8a897f;--dim:#5a594f;--gold:#d4b46d;--gold-dim:rgba(212,180,109,.1);--gold-border:rgba(212,180,109,.25);--green:#6ee09c;--blue:#7cb8ff;--red:#ef6c6c;--serif:'Instrument Serif',Georgia,serif;--sans:'DM Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

/* Layout */
.app{display:flex;flex-direction:column;height:100vh}
.topbar{height:52px;border-bottom:1px solid var(--border);background:rgba(7,7,11,.92);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0;z-index:50}
.topbar-left{display:flex;align-items:center;gap:10px}
.av-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#a8893a);display:grid;place-items:center;font-size:12px;font-weight:900;color:#0a0a0a}
.topbar-name{font-size:14px;font-weight:700}
.topbar-label{font-size:9px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.mode-toggle{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.mode-btn{background:none;border:none;color:var(--muted);font-family:var(--sans);font-size:12px;font-weight:600;padding:7px 14px;cursor:pointer;transition:.15s}
.mode-btn.active{background:var(--gold-dim);color:var(--gold)}
.mode-btn:hover:not(.active){color:var(--soft);background:var(--surface)}

/* Chat area */
.chat-body{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.chat-messages{flex:1;max-width:760px;width:100%;margin:0 auto;padding:20px 20px 10px}

/* Empty state */
.empty{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 20px;max-width:760px;width:100%;margin:0 auto}
.empty-mark{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--gold),#a8893a);display:grid;place-items:center;font-size:18px;font-weight:900;color:#0a0a0a;margin-bottom:20px}
.empty h2{font-family:var(--serif);font-size:26px;font-weight:400;margin-bottom:8px}
.empty h2 em{color:var(--gold);font-style:italic}
.empty p{font-size:14px;color:var(--muted);max-width:460px;line-height:1.55}

/* Messages */
.msg{display:flex;gap:10px;margin-bottom:16px}
.msg.user{justify-content:flex-end}
.msg-avatar{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--gold),#a8893a);display:grid;place-items:center;font-size:10px;font-weight:900;color:#0a0a0a;flex-shrink:0;margin-top:2px}
.msg-bubble{max-width:72%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.65}
.msg.agent .msg-bubble{background:var(--surface);border:1px solid var(--border);color:var(--soft);border-top-left-radius:4px}
.msg.user .msg-bubble{background:rgba(212,180,109,.1);border:1px solid var(--gold-border);color:var(--text);border-top-right-radius:4px}
.msg.agent .msg-bubble strong{color:var(--text)}
.msg.agent .msg-bubble hr{border:none;border-top:1px solid var(--border);margin:8px 0}
.typing{display:flex;gap:5px;padding:6px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.3}
.typing span:nth-child(1){animation:tp 1.2s ease .0s infinite}
.typing span:nth-child(2){animation:tp 1.2s ease .2s infinite}
.typing span:nth-child(3){animation:tp 1.2s ease .4s infinite}
@keyframes tp{0%,100%{opacity:.2;transform:scale(.85)}50%{opacity:.7;transform:scale(1)}}

/* Input area */
.input-area{border-top:1px solid var(--border);background:rgba(7,7,11,.95);backdrop-filter:blur(12px);flex-shrink:0;padding:12px 0 max(12px, env(safe-area-inset-bottom))}
.input-inner{max-width:760px;margin:0 auto;padding:0 20px}

/* Active skill chip */
.skill-chip{display:none;align-items:center;gap:6px;margin-bottom:8px;padding:5px 10px;border:1px solid var(--gold-border);border-radius:8px;background:var(--gold-dim);font-size:12px;color:var(--gold);font-weight:600;width:fit-content}
.skill-chip.show{display:inline-flex}
.skill-chip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;margin-left:4px;padding:0}
.skill-chip button:hover{color:var(--red)}

/* File preview */
.file-chip{display:none;align-items:center;gap:6px;margin-bottom:8px;padding:5px 10px;border:1px solid var(--border2);border-radius:8px;background:var(--surface2);font-size:12px;color:var(--soft);width:fit-content}
.file-chip.show{display:inline-flex}
.file-chip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0}

/* Compose row */
.compose{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--border);border-radius:16px;background:rgba(255,255,255,.025);padding:8px 12px;transition:border-color .15s}
.compose:focus-within{border-color:var(--gold-border)}
.compose textarea{flex:1;background:none;border:none;color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;resize:none;outline:none;min-height:24px;max-height:120px}
.compose textarea::placeholder{color:var(--dim)}
.compose-send{width:32px;height:32px;border-radius:8px;border:none;background:var(--surface);color:var(--dim);font-size:16px;font-weight:900;cursor:default;display:grid;place-items:center;transition:.15s;flex-shrink:0}
.compose-send.active{background:var(--gold);color:#0a0a0a;cursor:pointer}

/* Action bar */
.actions{display:flex;align-items:center;gap:4px;margin-top:8px}
.act-btn{display:flex;align-items:center;gap:5px;background:none;border:1px solid transparent;border-radius:8px;padding:5px 10px;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--dim);cursor:pointer;transition:.15s;position:relative}
.act-btn:hover{color:var(--soft);border-color:var(--border);background:var(--surface)}
.act-btn.recording{color:var(--red);border-color:rgba(239,108,108,.3);background:rgba(239,108,108,.06)}
.act-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act-spacer{flex:1}

/* Dropdown */
.dropdown{display:none;position:absolute;bottom:calc(100% + 6px);left:0;min-width:260px;max-height:340px;overflow-y:auto;background:rgba(14,14,18,.97);backdrop-filter:blur(16px);border:1px solid var(--border2);border-radius:14px;padding:6px;z-index:100;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.dropdown.show{display:block}
.dropdown.right{left:auto;right:0}
.dd-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:8px 10px 4px}
.dd-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:.12s;border:none;background:none;width:100%;text-align:left;font-family:var(--sans);color:var(--soft)}
.dd-item:hover{background:var(--surface2)}
.dd-item .dd-icon{width:32px;height:32px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:13px;flex-shrink:0}
.dd-item .dd-icon svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:1.6}
.dd-item .dd-text{font-size:13px;font-weight:600;line-height:1.2}
.dd-item .dd-desc{font-size:11px;color:var(--muted);font-weight:400;margin-top:1px;line-height:1.3}
.dd-item.example-item{padding:10px 12px}
.dd-item.example-item .dd-text{font-size:12px;font-weight:400;color:var(--muted);line-height:1.4}

/* Overlay to close dropdowns */
.overlay{display:none;position:fixed;inset:0;z-index:90}
.overlay.show{display:block}

/* Mobile */
@media(max-width:640px){
  .topbar{padding:0 12px;height:48px}
  .topbar-name{font-size:13px}
  .mode-btn{font-size:11px;padding:6px 10px}
  .chat-messages,.input-inner{padding-left:14px;padding-right:14px}
  .msg-bubble{max-width:88%;font-size:13px;padding:10px 14px}
  .compose textarea{font-size:16px}
  .empty h2{font-size:22px}
  .empty p{font-size:13px}
  .dropdown{min-width:220px}
}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:3px}
</style>
</head>
<body>
<div class="app">

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="av-mark">AV</div>
      <div>
        <div class="topbar-name">Intelligence Desk</div>
        <div class="topbar-label">Action Ventures Europe</div>
      </div>
    </div>
    <div class="mode-toggle">
      <button class="mode-btn active" id="btnFounder" onclick="switchMode('founder')">Founders</button>
      <button class="mode-btn" id="btnInvestor" onclick="switchMode('investor')">Investors</button>
    </div>
  </div>

  <!-- Chat body -->
  <div class="chat-body" id="chatBody">
    <div class="chat-messages" id="chatMessages"></div>
  </div>

  <!-- Input area -->
  <div class="input-area">
    <div class="input-inner">
      <div class="skill-chip" id="skillChip">
        <span id="skillChipText"></span>
        <button onclick="clearSkill()">×</button>
      </div>
      <div class="file-chip" id="fileChip">
        <span id="fileChipText"></span>
        <button onclick="removeFile()">×</button>
      </div>
      <div class="compose">
        <textarea id="chatInput" rows="1" placeholder="Ask about fundraising, deals, portfolios..." oninput="autoGrow(this);updateSend()"></textarea>
        <button class="compose-send" id="sendBtn" onclick="sendMessage()">↑</button>
      </div>
      <div class="actions">
        <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.csv,.txt,.md,.json" style="display:none" onchange="handleFile(event)">
        <button class="act-btn" onclick="document.getElementById('fileInput').click()">
          <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
          File
        </button>
        <button class="act-btn" id="micBtn" onclick="toggleVoice()">
          <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>
          Voice
        </button>
        <div style="position:relative">
          <button class="act-btn" id="skillsBtn" onclick="toggleDropdown('skills')">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            Skills
          </button>
          <div class="dropdown" id="skillsDropdown"></div>
        </div>
        <div style="position:relative">
          <button class="act-btn" onclick="toggleDropdown('examples')">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
            Examples
          </button>
          <div class="dropdown right" id="examplesDropdown"></div>
        </div>
        <div class="act-spacer"></div>
      </div>
    </div>
  </div>
  <div class="overlay" id="overlay" onclick="closeDropdowns()"></div>
</div>

<script>
// ── SKILL ICONS (inline SVGs instead of emoji) ──
const ICONS = {

// ── SKILLS ──
const SKILLS={
founder:[
{id:'f1',icon:'chart',name:'Readiness Assessment',desc:'5-dimension investor readiness score',placeholder:'Describe your startup — what you do, traction, stage, team, what you\'re raising...',system:`You are the Action Ventures Readiness Assessment Engine. Assess a founder's startup across 5 dimensions. Be direct, specific, commercial.\n\nRespond with:\n\n**INVESTOR READINESS ASSESSMENT**\n**Action Ventures Intelligence Desk**\n\n---\n\n**Company Snapshot:** [2-3 sentences]\n\n**Overall Readiness Score: [X]/10** — [justification]\n\n---\n\n**DIMENSION SCORES**\n\n**1. Market Reality — [X]/10**\n[2-3 sentences]\n\n**2. Product & Traction — [X]/10**\n[2-3 sentences]\n\n**3. Team — [X]/10**\n[2-3 sentences]\n\n**4. Commercial Model — [X]/10**\n[2-3 sentences]\n\n**5. AI & Tech Leverage — [X]/10**\n[2-3 sentences]\n\n---\n\n**WHAT INVESTORS WILL LIKE**\n• [3 strengths]\n\n**WHAT INVESTORS WILL QUESTION**\n• [3 objections]\n\n**MISSING INFORMATION**\n[What wasn't mentioned]\n\n---\n\n**30-DAY ACTION PLAN**\n1-3. Prioritised actions\n\n**ACTION VENTURES NOTE**\n[How AV helps specifically]\n\nNever score above 8 without exceptional evidence.`},
{id:'f2',icon:'file',name:'Pitch Deck Teardown',desc:'Slide-by-slide feedback with objection mapping',placeholder:'Paste your deck content or describe each slide...',system:`You are the Action Ventures Deck Teardown Engine. Analyse a pitch deck slide by slide.\n\nRespond with:\n\n**PITCH DECK TEARDOWN**\n**Action Ventures Intelligence Desk**\n\n**Overall Deck Score: [X]/10**\n\n**First Impression (5-second test):** [What investors think]\n\nFor each slide:\n**Slide [N]: [Topic]**\n- What works / What doesn't / Investor reaction / Fix\n\n**MISSING SLIDES**\n**NARRATIVE ASSESSMENT**\n**INVESTOR OBJECTION MAP** (top 5)\n**PRIORITY FIXES** (top 3)`},
{id:'f3',icon:'folder',name:'Data Room Audit',desc:'Completeness scoring across 7 categories',placeholder:'List the documents in your data room or describe what you have...',system:`You are the Action Ventures Data Room Audit Engine. Evaluate data room completeness.\n\nRespond with:\n\n**DATA ROOM AUDIT**\n**Action Ventures Intelligence Desk**\n\n**Completeness Score: [X]%**\n\n7 categories scored (Financials, Legal, Product, Market, Team, Customers, Fundraising): each with status, what's present, what's missing.\n\n**RED FLAGS**\n**PRIORITY BUILD LIST** (top 5 with effort estimates)\n**RECOMMENDED FOLDER STRUCTURE**`},
{id:'f4',icon:'mail',name:'Investor Update Drafter',desc:'Monthly KPIs → formatted investor update',placeholder:'Share metrics: revenue, burn, runway, wins, challenges, asks...',system:`You are the Action Ventures Update Drafter. Transform monthly data into a polished investor update under 400 words.\n\nRespond with:\n\n**[COMPANY] — MONTHLY UPDATE**\n**[Month Year]**\n\n**HEADLINE:** [Most important thing]\n\n**KEY METRICS** (table: metric, this month, last month, change)\n\n**HIGHLIGHTS** • 2-3 wins\n**CHALLENGES** • 1-2 with actions\n**PRODUCT UPDATE** [2-3 sentences]\n**LOOKING AHEAD** [Priorities]\n**THE ASK** [Specific needs]\n\nNever inflate. Brevity is respect.`},
{id:'f5',icon:'target',name:'GTM Reality Check',desc:'Is your go-to-market credible?',placeholder:'Describe your GTM — acquisition, sales model, pricing, channels...',system:`You are the Action Ventures GTM Reality Check Engine.\n\nRespond with:\n\n**GTM REALITY CHECK**\n**Action Ventures Intelligence Desk**\n\n**Credibility Score: [X]/10**\n\nAssess: Customer Acquisition, Sales Model, Pricing, Distribution, Competitive Positioning — each with stated approach vs reality check.\n\n**THE HARD QUESTIONS** (5 investors will ask)\n**GTM SPRINT** (3 actions for next 30 days)`},
{id:'f6',icon:'cpu',name:'AI Leverage Audit',desc:'Genuine advantage or AI lipstick?',placeholder:'Describe how your startup uses AI and its impact...',system:`You are the Action Ventures AI Leverage Audit Engine.\n\nRespond with:\n\n**AI LEVERAGE AUDIT**\n**Action Ventures Intelligence Desk**\n\n**Verdict: [GENUINE / PARTIAL / AI LIPSTICK]**\n**Score: [X]/10**\n\nAssess 5 dimensions: Margin Impact, Defensibility, Capability Creation (the "intern test"), Data Advantage, Cost Structure.\n\n**INVESTOR PERCEPTION**\n**RECOMMENDATIONS** (3)`},
{id:'f7',icon:'book',name:'Fundraising Narrative',desc:'Build the story investors need to hear',placeholder:'Tell me about your company, problem, traction, team, and raise...',system:`You are the Action Ventures Narrative Builder.\n\nRespond with:\n\n**FUNDRAISING NARRATIVE**\n**Action Ventures Intelligence Desk**\n\n**ONE-LINER** [Hook]\n**ELEVATOR PITCH** [30 seconds]\n\n**NARRATIVE ARC:**\nAct 1: The World Is Broken\nAct 2: The Shift (why now)\nAct 3: The Solution\nAct 4: The Proof\nAct 5: The Machine (model)\nAct 6: The Team\nAct 7: The Ask\n\n**INVESTOR EMAIL** (150 words, with subject line)\n**OBJECTION PRE-EMPTS** (3)\n**NARRATIVE GAPS**`}
],
investor:[

};

const EXAMPLES={
founder:[
"We're a B2B SaaS in AI-powered hotel revenue management, €30k MRR, raising a €2M seed round",
"Travel marketplace connecting local guides with tourists, 50k app downloads, pre-revenue, seeking €500k",
"AI-driven due diligence platform for VCs, just launched beta with 3 pilot customers"
],
investor:[
"Family office focused on AI + hospitality, €100k-500k tickets, European early-stage",
"Angel investor in travel-tech and marketplace businesses, pre-seed to seed stage",
"VC looking at B2B SaaS in proptech and fintech, Series A, €2-5M cheques"
]
};

// ── STATE ──
let mode='founder', skill=null, msgs=[], loading=false, pendingFile=null, recognition=null, isRec=false;
const $=id=>document.getElementById(id);

// ── RENDER ──
function renderEmpty(){
  const el=$('chatMessages');
  el.innerHTML=`<div class="empty"><div class="empty-mark">AV</div><h2>${mode==='founder'?'What can we help you <em>build</em>?':'What deal intelligence do you <em>need</em>?'}</h2><p>Select a skill from below, try an example, or just describe what you need.</p></div>`;
}

function renderMsgs(){
  const el=$('chatMessages');
  el.innerHTML=msgs.map(m=>{
    if(m.role==='user') return `<div class="msg user"><div class="msg-bubble">${esc(m.content)}</div></div>`;
    return `<div class="msg agent"><div class="msg-avatar">AV</div><div class="msg-bubble">${fmt(m.content)}</div></div>`;
  }).join('');
  if(loading) el.innerHTML+=`<div class="msg agent"><div class="msg-avatar">AV</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>`;
  $('chatBody').scrollTop=$('chatBody').scrollHeight;
}

function fmt(t){return t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/^[•\-] (.+)$/gm,'<div style="padding-left:14px;margin:2px 0">• $1</div>').replace(/^(\d+)\. (.+)$/gm,'<div style="padding-left:14px;margin:2px 0">$1. $2</div>').replace(/---/g,'<hr>').replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>')}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function autoGrow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px'}
function updateSend(){const has=($('chatInput').value.trim()||pendingFile)&&!loading;$('sendBtn').classList.toggle('active',!!has)}

// ── MODE ──
function switchMode(m){
  mode=m;skill=null;msgs=[];loading=false;
  $('btnFounder').classList.toggle('active',m==='founder');
  $('btnInvestor').classList.toggle('active',m==='investor');
  clearSkill();removeFile();renderEmpty();
  $('chatInput').placeholder='Ask about '+(m==='founder'?'fundraising, readiness, decks...':'deals, portfolios, sectors...');
  updateSend();
}

// ── SKILLS ──
function buildSkillsDD(){
  const sk=SKILLS[mode];
  $('skillsDropdown').innerHTML=`<div class="dd-label">${mode==='founder'?'Founder':'Investor'} Skills</div>`+sk.map(s=>`<button class="dd-item" onclick="pickSkill('${s.id}')"><div class="dd-icon">${ICONS[s.icon]}</div><div><div class="dd-text">${s.name}</div><div class="dd-desc">${s.desc}</div></div></button>`).join('');
}
function buildExamplesDD(){
  const ex=EXAMPLES[mode];
  $('examplesDropdown').innerHTML=`<div class="dd-label">Try an example</div>`+ex.map(e=>`<button class="dd-item example-item" onclick="useExample(this)" data-ex="${e.replace(/"/g,'&quot;')}"><div class="dd-text">"${e}"</div></button>`).join('');
}
function pickSkill(id){
  const s=SKILLS[mode].find(x=>x.id===id);
  if(!s)return;
  skill=s;
  $('skillChipText').textContent=s.name;
  $('skillChip').classList.add('show');
  $('chatInput').placeholder=s.placeholder;
  $('chatInput').focus();
  closeDropdowns();
}
function clearSkill(){
  skill=null;
  $('skillChip').classList.remove('show');
  $('chatInput').placeholder='Ask about '+(mode==='founder'?'fundraising, readiness, decks...':'deals, portfolios, sectors...');
}
function useExample(el){
  $('chatInput').value=el.dataset.ex;
  autoGrow($('chatInput'));
  updateSend();
  closeDropdowns();
  $('chatInput').focus();
}
function toggleDropdown(which){
  const dd=$(which+'Dropdown');
  const show=!dd.classList.contains('show');
  closeDropdowns();
  if(show){
    if(which==='skills')buildSkillsDD();
    if(which==='examples')buildExamplesDD();
    dd.classList.add('show');
    $('overlay').classList.add('show');
  }
}
function closeDropdowns(){
  $('skillsDropdown').classList.remove('show');
  $('examplesDropdown').classList.remove('show');
  $('overlay').classList.remove('show');
}

// ── FILES ──
function handleFile(ev){
  const f=ev.target.files[0];if(!f)return;
  if(f.size>10*1024*1024){alert('Max 10MB');return}
  const r=new FileReader();
  r.onload=function(e){
    const b64=e.target.result.split(',')[1];
    let mt=f.type;
    if(f.name.endsWith('.pdf'))mt='application/pdf';
    if(f.name.match(/\.(csv|txt|md|json)$/i)){
      const tr=new FileReader();
      tr.onload=function(te){pendingFile={name:f.name,type:'text',content:te.target.result};showFile(f.name)};
      tr.readAsText(f);return;
    }
    pendingFile={name:f.name,type:'binary',base64:b64,mediaType:mt};showFile(f.name);
  };
  r.readAsDataURL(f);ev.target.value='';
}
function showFile(n){$('fileChipText').textContent=n;$('fileChip').classList.add('show');updateSend()}
function removeFile(){pendingFile=null;$('fileChip').classList.remove('show');updateSend()}

// ── VOICE ──
function toggleVoice(){
  if(isRec){stopVoice();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Voice not supported. Try Chrome or Safari.');return}
  recognition=new SR();recognition.lang='en-US';recognition.interimResults=true;recognition.continuous=true;
  recognition.onresult=function(ev){let t='';for(let i=0;i<ev.results.length;i++)t+=ev.results[i][0].transcript;$('chatInput').value=t;autoGrow($('chatInput'));updateSend()};
  recognition.onerror=function(){stopVoice()};recognition.onend=function(){stopVoice()};
  recognition.start();isRec=true;$('micBtn').classList.add('recording');
}
function stopVoice(){if(recognition){recognition.stop();recognition=null}isRec=false;$('micBtn').classList.remove('recording')}

// ── SEND ──
async function sendMessage(){
  const inp=$('chatInput'),text=inp.value.trim();
  if((!text&&!pendingFile)||loading)return;
  if(isRec)stopVoice();

  // Determine system prompt
  let sys='';
  if(skill){sys=skill.system}
  else{sys=mode==='founder'?'You are the Action Ventures Founder Intelligence Agent. Provide structured, operator-grade analysis for founders preparing for fundraising. Be direct, specific, and commercial. Format responses with clear headers and bullet points.':'You are the Action Ventures Investor Intelligence Agent. Provide structured deal intelligence for investors and family offices. Be sharp, knowledgeable, and opinionated. Format responses with clear headers and bullet points.'}

  // Build content
  let userContent,display=text;
  if(pendingFile){
    if(pendingFile.type==='text'){
      userContent='[File: '+pendingFile.name+']\n\n'+pendingFile.content+'\n\n'+(text||'Please analyse this file.');
      display=(text||'Analyse file')+' \ud83d\udcce '+pendingFile.name;
    }else if(pendingFile.mediaType==='application/pdf'){
      userContent=[{type:'document',source:{type:'base64',media_type:'application/pdf',data:pendingFile.base64}},{type:'text',text:text||'Please analyse this document.'}];
      display=(text||'Analyse document')+' \ud83d\udcce '+pendingFile.name;
    }else{
      userContent=[{type:'image',source:{type:'base64',media_type:pendingFile.mediaType,data:pendingFile.base64}},{type:'text',text:text||'Please analyse this image.'}];
      display=(text||'Analyse image')+' \ud83d\udcce '+pendingFile.name;
    }
  }else{userContent=text}

  msgs.push({role:'user',content:display});
  const apiMsg={role:'user',content:userContent};
  inp.value='';inp.style.height='auto';removeFile();loading=true;updateSend();renderMsgs();

  try{
    const apiMsgs=msgs.slice(0,-1).map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.content}));
    apiMsgs.push(apiMsg);
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:apiMsgs,system:sys})});
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||'API error');
    const aText=data.content?data.content.map(b=>b.text||'').join('\n'):'Unable to generate. Try again.';
    msgs.push({role:'assistant',content:aText});
  }catch(err){
    msgs.push({role:'assistant',content:"Connection error. Please try again."});
  }finally{loading=false;updateSend();renderMsgs()}
}

// ── INIT ──
$('chatInput').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
switchMode('founder');
</script>
